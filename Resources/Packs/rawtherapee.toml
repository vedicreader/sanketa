[[keys]]   # src: KS
keys = "⌃↩"
action = "OK in the Save window"
group = "Editor: output"

[[keys]]   # src: KS, EP
keys = "⌃E"
action = "Open in an external editor"
group = "Editor: output"

[[keys]]   # src: KS, EP, FB
keys = "⌃B"
action = "Add to the queue"
