[[tips]]
title = "Hyper is ⌃⌥⇧⌘"
snippet = "hyper+u  →  ⌃⌥⇧⌘U"
explain = "Leela's keymap uses a Hyper modifier (all four). Map Caps Lock to Hyper with Karabiner; Leela also accepts ⌃⌥ plus either ⇧ or ⌘."
tags = ["keys", "hyper", "setup"]

[[tips]]
title = "Rebind any key"
snippet = "~/.config/leela/keys.json   {\"keys\": {\"next_tab\": \"alt+]\"}}"
explain = "Hyper+K (edit_keys) opens it. Only changed actions go in \"keys\"; an empty string unbinds. $LEELA_KEYMAP overrides the path. Conflicts are skipped and reported."
tags = ["keys", "config", "keymap"]

[[tips]]
title = "Your tab keys are ⌥S / ⌥A"
snippet = "\"next_tab\": \"alt+ß\", \"prev_tab\": \"alt+å\""
explain = "Your keys.json binds next/prev tab to the characters ⌥S and ⌥A type on a US layout, replacing the defaults ⌥] and ⌥[."
tags = ["keys", "tabs", "config"]

[[tips]]
title = "Keys depend on the focused pane"
snippet = "global · files · editor · exec · vars · agent · term · vault · review"
explain = "One router picks a scope from the focused element, so bare letters (n, r, d, j, k) only fire in the file tree, variables or vault. The 'keys' sidebar panel shows the current scope next to its title."
tags = ["keys", "scope", "panes"]

[[tips]]
title = "Unbound actions live in the palette"
snippet = "⇧⌘P  →  nbdev prepare, fastship, vault review, close other tabs…"
explain = "About 40 actions ship without a chord (nbdev_prepare, fastship, git_stage, vault_find, quit…). Find them in the command palette, or bind one in keys.json."
tags = ["palette", "commands"]

[[tips]]
title = "Launch modes"
snippet = "leela  |  leela --shell webview  |  leela --app"
explain = "Plain `leela` serves on 127.0.0.1:5010 for a browser tab; --shell webview opens the native window Leela.app uses; --app opens an app window in fossick's CDP Chrome (port 9223)."
tags = ["cli", "launch", "desktop"]
