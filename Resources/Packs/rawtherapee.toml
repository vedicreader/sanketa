action = "Zoom in / out"
group = "Editor: view"

[[keys]]   # src: KS
keys = "h"
action = "Hand tool: move the view"
group = "Editor: view"

[[keys]]   # src: KS, EP
keys = "9"
action = "Change the preview background"
group = "Editor: view"

[[keys]]   # src: KS, EP
keys = "B"
action = "Before and after view"
group = "Editor: view"

[[keys]]   # src: KS, EP
keys = "i"
action = "Show photo info (Exif)"
group = "Editor: view"

# --- Editor: check the photo --------------------------------------------

[[keys]]   # src: KS, EP
keys = "<"
action = "Show clipped shadows"
group = "Editor: check"

[[keys]]   # src: KS, EP
keys = ">"
action = "Show clipped highlights"
group = "Editor: check"

[[keys]]   # src: KS, EP
keys = "r / g / b"
action = "Red / green / blue only"
group = "Editor: check"

[[keys]]   # src: KS, EP
keys = "v"
action = "Luminosity only"
group = "Editor: check"

[[keys]]   # src: KS, EP
keys = "F"
action = "Focus mask (sharp areas)"
group = "Editor: check"

[[keys]]   # src: EP (not in KS)
keys = "p"
action = "Sharpening contrast mask"
group = "Editor: check"

# --- Editor: tools ------------------------------------------------------

[[keys]]   # src: KS
keys = "c"
action = "Crop tool"
group = "Editor: tools"

[[keys]]   # src: KS
keys = "s"
action = "Straighten: draw a level line"
group = "Editor: tools"

[[keys]]   # src: KS
keys = "w"
action = "White balance spot picker"
group = "Editor: tools"

[[keys]]   # src: KS, EP
keys = "[ / ]"
action = "Turn left / right"
group = "Editor: tools"

[[keys]]   # src: KS, EP
keys = "⌃Z"
