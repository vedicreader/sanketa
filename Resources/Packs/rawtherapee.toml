# --- Rate and label -----------------------------------------------------
# Doubt: these keys use hardware key codes (FB, FC). I6577 says that number keys were
# shifted on macOS in 2022. Test them on your Mac.

[[keys]]   # src: FB. KS (2021) gives ⇧1–⇧5; the 5.13 source rates with the plain number.
keys = "1–5"
action = "Rate 1 to 5 stars"
group = "Rate and label"

[[keys]]   # src: FB
keys = "0"
action = "Remove the rating"
group = "Rate and label"

[[keys]]   # src: KS, FB
keys = "⌃⇧1–⌃⇧5"
action = "Label: red, yellow, green, blue, purple"
group = "Rate and label"

[[keys]]   # src: KS, FB
keys = "⌃⇧0"
action = "Remove the color label"
group = "Rate and label"

# --- Filters ------------------------------------------------------------

[[keys]]   # src: FC. KS (2021) gives the plain number; the 5.13 source uses ⇧.
keys = "⇧1–⇧5"
action = "Filter: N stars"
group = "Filters"

[[keys]]   # src: FC
keys = "⇧6 / ⇧7"
action = "Filter: not edited / edited"
group = "Filters"

[[keys]]   # src: KS, FC
keys = "d"
action = "Clear all filters"
group = "Filters"

# --- Option keys --------------------------------------------------------
# Doubt: I3510 (open) says ⌥ shortcuts do not work on macOS. On a US keyboard, ⌥E and ⌥I
# are dead keys. Keep these in one group so that the user can test them and remove them.

[[keys]]   # src: KS, EP
keys = "⌥F"
action = "Fit the whole image"
group = "Option keys (test first)"

[[keys]]   # src: KS, EP
keys = "⌥S"
action = "Add a snapshot"
group = "Option keys (test first)"

[[keys]]   # src: KS, EP, FC
keys = "⌥L"
action = "Right panel (tools)"
group = "Option keys (test first)"

[[keys]]   # src: KS
keys = "⌥E / ⌥D / ⌥C"
action = "Exposure / Detail / Color tab"
group = "Option keys (test first)"

[[keys]]   # src: KS
keys = "⌥A / ⌥T / ⌥R"
action = "Advanced / Transform / Raw tab"
group = "Option keys (test first)"

# --- Queue --------------------------------------------------------------

[[keys]]   # src: KS, BQ
keys = "⌃S"
action = "Start or stop the queue"
group = "Queue"

# --- Tips ---------------------------------------------------------------

[[tips]]   # src: I3510, RTW; macOS System Settings
title = "Free ⌃F2 to ⌃F4"
snippet = "System Settings → Keyboard → Keyboard Shortcuts → Keyboard → turn off the focus items"
explain = "By default, macOS uses ⌃F2 to ⌃F4 to move focus. Turn them off to change tabs in RawTherapee."
tags = ["tabs", "macos", "function keys"]

[[tips]]   # src: macOS System Settings (not RawTherapee docs)
title = "Use F keys without fn"
snippet = "System Settings → Keyboard → Keyboard Shortcuts → Function Keys → Use F1, F2, etc. keys as standard function keys"
explain = "On a MacBook, F2 to F4 change brightness. With this setting, they go to RawTherapee."
tags = ["function keys", "macos"]

[[tips]]   # src: KS
title = "Compare with the original"
snippet = "B"
explain = "Shows the photo before and after your edits, side by side. Push B again to close it."
tags = ["before", "after", "compare"]

[[tips]]   # src: KS
title = "Set exposure without lost detail"
snippet = "> then < , then move Exposure compensation"
explain = "Red areas have no highlight detail. Blue areas have no shadow detail. Move the slider until they are small."
tags = ["exposure", "clipping", "highlights", "shadows"]

[[tips]]   # src: KS
title = "Fix white balance from a grey area"
snippet = "w, click a neutral grey or white area, then right-click"
explain = "The picker sets the white balance from that spot. Right-click gives back the normal cursor."
tags = ["white balance", "color"]

[[tips]]   # src: KS
title = "Make the horizon level"
snippet = "s, then drag along the horizon"
explain = "The Rotate tool turns the photo so that the line you drew is level."
tags = ["rotate", "straighten", "horizon"]

[[tips]]   # src: KS
title = "Check what is in focus"
snippet = "F"
explain = "The focus mask shows the sharp areas of the photo. Push F again to remove it."
tags = ["focus", "sharpness"]

[[tips]]   # src: KS, FB
title = "Copy edits to other photos"
snippet = "⌃C on the edited thumbnail, select the other thumbnails, ⌃V"
explain = "Pastes all settings. Use ⌃⇧V to choose only some tools, such as white balance."
tags = ["copy", "paste", "batch", "profile"]

[[tips]]   # src: KS, EP, BQ
title = "Export many photos"
snippet = "⌃B on each photo, then ⌃F3, then ⌃S"
explain = "⌃B adds the photo to the queue. ⌃S in the Queue tab starts or stops the export."
tags = ["export", "queue", "batch"]

[[tips]]   # src: KS
title = "Try a change and go back"
snippet = "⌥S, make the change, then click the snapshot in the History panel"
explain = "A snapshot keeps the edits as they are now. If ⌥S does not work on your Mac, use the + button under Snapshots."
tags = ["snapshot", "history", "undo"]

[[tips]]   # src: KS. Doubt: GTK on macOS can treat ⌃ click as a right-click.
title = "Move a curve point slowly"
snippet = "⌃ drag a curve point"
explain = "The point moves slower than the mouse. Use ⇧ drag to snap the point to key positions."
tags = ["curves", "tone"]

[[tips]]   # src: KS. Doubt: GTK on macOS can treat ⌃ click as a right-click.
title = "Reset one slider"
snippet = "⌃ click the reset button of the slider"
explain = "Sets the slider to its value when you opened the photo. A click without ⌃ sets the default value."
tags = ["slider", "reset"]

[[tips]]   # src: KS
title = "Open one tool and close the others"
snippet = "Right-click the name of a tool"
explain = "Opens that tool and closes all other tools in the tab. Use it to keep the panel short."
tags = ["tools", "panel"]

[[tips]]   # src: KS, EP
title = "Keep your edits safe"
snippet = "⌃⇧S"
explain = "Writes the settings to the .pp3 file next to the photo now. RawTherapee also does this when you close the photo."
tags = ["save", "profile", "pp3"]
