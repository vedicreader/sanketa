# Keys: fish 4.8 default bindings (`fish_default_key_bindings; bind`). ⌥ keys need Option as Meta in your terminal.
id = "fish"
name = "fish"
processes = ["fish"]

[[keys]]
keys = "→ / ⌃F"
action = "Accept the autosuggestion"
group = "Suggestions & history"

[[keys]]
keys = "⌥→ / ⌥F"
action = "Accept one word of it"
group = "Suggestions & history"

[[keys]]
keys = "⇧→"
action = "Accept up to the next space"
group = "Suggestions & history"

[[keys]]
keys = "↑ / ↓"
action = "History matching what you typed"
group = "Suggestions & history"

[[keys]]
keys = "⌃R"
action = "Search all history (pager)"
group = "Suggestions & history"

[[keys]]
keys = "⌥↑ / ⌥."
action = "Recall an earlier argument"
group = "Suggestions & history"

[[keys]]
keys = "⌥← / ⌥→"
action = "cd back / forward (empty line)"
group = "Suggestions & history"

[[keys]]
keys = "⇥"
action = "Complete, press again for a menu"
group = "Completion"

[[keys]]
keys = "⇧⇥"
action = "Complete and search the menu"
group = "Completion"

[[keys]]
keys = "⌃S"
action = "Filter the completion menu"
group = "Completion"

[[keys]]
keys = "⌥L"
action = "List the directory under cursor"
group = "Completion"

[[keys]]
keys = "⌥O"
action = "Preview the file under cursor"
group = "Completion"

[[keys]]
keys = "⌥H / F1"
action = "Man page of this command"
group = "Help"

[[keys]]
keys = "⌥W"
action = "What is this command"
group = "Help"

[[keys]]
keys = "⌥S"
action = "Prepend sudo"
group = "Command line"

[[keys]]
keys = "⌥P"
action = "Append a pager (&| less)"
group = "Command line"

[[keys]]
keys = "⌥E / ⌥V"
action = "Edit the line in $EDITOR"
group = "Command line"

[[keys]]
keys = "⌥#"
action = "Comment the line out / in"
group = "Command line"

[[keys]]
keys = "⇧↩ / ⌥↩"
action = "Insert a newline"
group = "Command line"

[[keys]]
keys = "⌃C"
action = "Clear the line"
group = "Command line"

[[keys]]
keys = "⌃L"
action = "Clear the screen"
group = "Command line"

[[keys]]
keys = "⌃D"
action = "Delete char, or exit if empty"
group = "Command line"

[[keys]]
keys = "⌃X / ⌃V"
action = "Copy line / paste clipboard"
group = "Command line"

[[keys]]
keys = "⌃A / ⌃E"
action = "Start / end of line"
group = "Editing"

[[keys]]
keys = "⌃U / ⌃K"
action = "Cut to start / to end"
group = "Editing"

[[keys]]
keys = "⌃W"
action = "Cut one path component back"
group = "Editing"

[[keys]]
keys = "⌥⌫ / ⌥D"
action = "Cut word back / forward"
group = "Editing"

[[keys]]
keys = "⌃Y / ⌥Y"
action = "Paste cut text / cycle older"
group = "Editing"

[[keys]]
keys = "⌃Z / ⌥/"
action = "Undo / redo"
group = "Editing"

[[keys]]
keys = "⌃T / ⌥T"
action = "Swap chars / swap words"
group = "Editing"

[[keys]]
keys = "⌥U / ⌥C"
action = "Uppercase / capitalize word"
group = "Editing"

[[tips]]
title = "Loop over files"
snippet = "for f in *.csv; echo $f (wc -l < $f); end"
explain = "fish has no do or done. The block stops at end, and (cmd) puts in the output of a command."
tags = ["loops", "files"]

[[tips]]
title = "Branch with if and test"
snippet = "if test -f config.toml; echo file; else if test -d config; echo dir; else; echo none; end"
explain = "test -f file, -d dir, -n non-empty, -z empty, = for strings, -gt for numbers."
tags = ["conditions"]

[[tips]]
title = "Split a string into a list"
snippet = "set parts (string split , 'red,green,blue'); echo $parts[2]"
explain = "One item per piece. Lists index from 1, $parts[-1] is the last."
tags = ["strings", "lists"]

[[tips]]
title = "Split only at the first separator"
snippet = "string split -m1 = 'key=a=b'"
explain = "-m1 gives key and a=b. Use it for key=value lines."
tags = ["strings"]

[[tips]]
title = "Rename files with string replace"
snippet = "for f in *.jpeg; mv $f (string replace -r '\\.jpeg$' .jpg $f); end"
explain = "-r uses a regex, and -a replaces each match. You do not need sed."
tags = ["strings", "files"]

[[tips]]
title = "Pull numbers out with string match"
snippet = "string match -rg 'v(\\d+)\\.(\\d+)' v4.8"
explain = "-r uses a regex, and -g prints only the groups, 4 then 8. -q only tests."
tags = ["strings", "regex"]

[[tips]]
title = "Test a glob with string match"
snippet = "string match -q '*.log' $file; and echo log file"
explain = "Without -r the pattern is a glob. -q prints nothing and only sets $status."
tags = ["strings", "conditions"]

[[tips]]
title = "Arithmetic with math"
snippet = "math 17 / 4; math -s0 17 / 4; math 2 ^ 10; math 'round(3.14159 * 100) / 100'"
explain = "The output is 4.25, 4, 1024 and 3.14. -s0 removes the decimals. Put quotes around text with * or ( )."
tags = ["math"]

[[tips]]
title = "Variable scopes"
snippet = "set -l tmp (mktemp); set -g count 0; set -U EDITOR nvim"
explain = "-l is for this block or function, and -g is for this session. -U is for all fish shells, also after a restart."
tags = ["variables"]

[[tips]]
title = "Export to child programs"
snippet = "set -gx AWS_PROFILE dev; set -e AWS_PROFILE"
explain = "-x is fish's export. set -e erases the variable again."
tags = ["variables", "env"]

[[tips]]
title = "Set a variable for one command"
snippet = "DEBUG=1 make test"
explain = "Put VAR=value before the command. The rest of the shell does not see it."
tags = ["variables", "env"]

[[tips]]
title = "Recursive glob instead of find"
snippet = "grep -n TODO **.swift"
explain = "** descends into subdirectories. **/*.swift works too."
tags = ["files", "globbing"]

[[tips]]
title = "Command substitution"
snippet = "set branch (git branch --show-current); echo on $branch"
explain = "(cmd) or $(cmd). Output is split on newlines into a list."
tags = ["substitution"]

[[tips]]
title = "Chain on success or failure"
snippet = "make; and ./run; or echo build failed"
explain = "and runs if the last command succeeded, or if it failed. && and || work too."
tags = ["conditions"]

[[tips]]
title = "Compare two outputs as files"
snippet = "diff (sort a.txt | psub) (sort b.txt | psub)"
explain = "psub turns a pipeline into a temp file name, for tools that want files."
tags = ["pipes", "substitution"]

[[tips]]
title = "Read lines from a pipe"
snippet = "cat hosts.txt | while read -l host; ping -c1 -t1 $host >/dev/null; and echo up $host; end"
explain = "read -l keeps $host local to the loop. It reads one line in each pass."
tags = ["loops", "pipes"]

[[tips]]
title = "Lists, count and contains"
snippet = "echo $PATH[1]; count $PATH; contains /opt/homebrew/bin $PATH; and echo on PATH"
explain = "Every variable is a list. count gives its length, contains tests membership."
tags = ["lists"]

[[tips]]
title = "Write and keep a function"
snippet = "function mkcd; mkdir -p $argv[1]; and cd $argv[1]; end; funcsave mkcd"
explain = "$argv holds the arguments. funcsave writes ~/.config/fish/functions/mkcd.fish."
tags = ["functions"]

[[tips]]
title = "Abbreviations that expand"
snippet = "abbr -a gs git status"
explain = "When you type gs and a space, fish changes it to git status. Thus the history keeps the full command."
tags = ["config"]

[[tips]]
title = "Add a directory to PATH once"
snippet = "fish_add_path ~/.local/bin"
explain = "The change stays after a restart and adds no copies. You do not edit config.fish."
tags = ["config", "env"]
