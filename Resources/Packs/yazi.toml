[[tips]]
title = "Change folder when yazi quits"
snippet = "function y\n    set tmp (mktemp -t yazi-cwd)\n    yazi $argv --cwd-file=$tmp\n    set cwd (cat $tmp)\n    test -n \"$cwd\"; and cd $cwd\n    command rm -f $tmp\nend"
explain = "This fish function starts yazi with a cwd file. When you quit with q, the shell goes to the last folder."
tags = ["shell", "cwd"]

[[tips]]
title = "Sort the files"
snippet = ", m  /  , s  /  , a"
explain = "Press a comma, then a letter. m sorts by time, s by size and a by name. Use the capital letter for the reverse order."
tags = ["sort"]
