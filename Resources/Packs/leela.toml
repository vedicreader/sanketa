[[tips]]
title = "Caps Lock is Hyper"
snippet = "hyper+u  →  Caps U  (⌃⌥⇧⌘U)"
explain = "Hyper is ⌃⌥⇧⌘ pressed together. On this Mac, Caps Lock sends Hyper, so the panel shows it as Caps. Set hyper_label in config.toml to change this word."
tags = ["keys", "hyper", "setup"]

[[tips]]
title = "Change any key"
snippet = "~/.config/leela/keys.json   {\"keys\": {\"next_tab\": \"alt+]\"}}"
explain = "The Edit keybindings action opens this file. Put only the actions that you change in \"keys\". An empty string removes the key. The panel reads the file again when it changes."
tags = ["keys", "config", "keymap"]

[[tips]]
title = "Keys depend on the focused pane"
snippet = "global · files · editor · exec · vars · agent · term · vault · review"
explain = "Leela picks a scope from the focused pane. Single letters such as n, r, d, j and k work only in the file tree, the variables or the vault. Leela's keys panel shows the current scope."
tags = ["keys", "scope", "panes"]

[[tips]]
title = "Find actions that have no key"
snippet = "⇧⌘P  →  nbdev prepare, fastship, vault review, close other tabs…"
explain = "About 40 actions have no key, for example nbdev_prepare, fastship, git_stage and quit. Find them in the command palette, or give one a key in keys.json."
tags = ["palette", "commands"]

[[tips]]
title = "Launch modes"
snippet = "leela  |  leela --shell webview  |  leela --app"
explain = "Plain leela serves the IDE on 127.0.0.1:5010 for a browser tab. Use --shell webview to open the native window that Leela.app uses. Use --app to open an app window in Chrome on port 9223."
tags = ["cli", "launch", "desktop"]
