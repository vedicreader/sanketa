# A Sanketa pack for RawTherapee 5.13 (macOS). Made with prompt-template.md, variant A.
# To check it, run: Sanketa --lint-pack rawtherapee.toml
#
# Sources. Each entry has a "# src:" line with one or more of these tags.
#   KS   RawPedia, "Keyboard Shortcuts", revision 8198 (7 May 2021).
#        The live page (rawpedia.rawtherapee.com/Keyboard_Shortcuts) gave 404 on 25 Oct 2026.
#        Read from https://web.archive.org/web/20260108135948/https://rawpedia.rawtherapee.com/Keyboard_Shortcuts
#   RTW  RawTherapee 5.13 source, rtgui/windows/rtwindow.cc, RTWindow::keyPressed
#   EP   RawTherapee 5.13 source, rtgui/editorpanel.cc, EditorPanel::handleShortcutKey
#   FC   RawTherapee 5.13 source, rtgui/filecatalog.cc, FileCatalog::handleShortcutKey
#   FB   RawTherapee 5.13 source, rtgui/filebrowser.cc, FileBrowser::keyPressed
#   BQ   RawTherapee 5.13 source, rtgui/batchqueuepanel.cc
#   PL   RawTherapee 5.13 source, tools/osx/Info.plist.in (CFBundleIdentifier)
#   I3510, I6577  GitHub issues RawTherapee/RawTherapee #3510 (open) and #6577 (closed 2022)
#
# Mac key rule. RawTherapee is a GTK app. Its code tests GDK_CONTROL_MASK, which is the
# Control key on macOS, not Command. Only Quit uses Command (⌘Q, RTW). Thus "Ctrl" in KS is ⌃ here.
# "Alt" in KS is ⌥. The app menu bar is empty (RTW makes a dummy menu), so Sanketa reads only
# the standard app menu (⌘Q, ⌘H). This pack does not repeat those keys.
# Where KS and the 5.13 source do not agree (number keys), this pack follows the source.

id = "rawtherapee"
name = "RawTherapee"
apps = ["com.rawtherapee.RawTherapee"]   # src: PL

# --- Tabs ---------------------------------------------------------------

[[keys]]   # src: KS, RTW. macOS uses ⌃F2 and ⌃F3 by default; see the tip "Free ⌃F2 to ⌃F4".
keys = "⌃F2"
action = "Go to File Browser"
group = "Tabs"

[[keys]]   # src: KS, RTW
keys = "⌃F3"
action = "Go to Queue"
group = "Tabs"

[[keys]]   # src: KS, RTW (single editor tab mode only)
keys = "⌃F4"
action = "Go to Editor"
group = "Tabs"

[[keys]]   # src: KS, FC
keys = "⌃F"
action = "Find in the focused list"
group = "Tabs"

# --- Processing profile -------------------------------------------------

[[keys]]   # src: KS, FB
keys = "⌃C"
action = "Copy processing profile"
group = "Processing profile"

[[keys]]   # src: KS, FB
keys = "⌃V"
action = "Paste processing profile"
group = "Processing profile"

[[keys]]   # src: KS, FB
keys = "⌃⇧V"
action = "Paste part of the profile"
group = "Processing profile"

[[keys]]   # src: KS, EP
keys = "⌃⇧S"
action = "Save the profile now"
group = "Processing profile"

