id = "leela"
name = "Leela"
# Leela.app is pywebview (WKWebView) with this bundle id.
apps = ["org.vedicreader.leela"]
processes = []
match = []

# Leela's shipped defaults (leela/core/keys.py), in Leela's chord syntax, with the action id in `command`.
# At load Sanketa overlays ~/.config/leela/keys.json (or $LEELA_KEYMAP): `keys` overrides win, "" hides the entry,
# and space-separated chords are alternatives. Entries without `command` are fixed keys that keys.json can't change.

