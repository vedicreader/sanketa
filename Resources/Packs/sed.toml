# Written for macOS (BSD) sed; GNU-only forms are noted. Snippets run in fish and bash.
id = "sed"
name = "sed"
processes = ["sed", "gsed"]

[[tips]]
title = "Replace every match"
snippet = "sed 's/colour/color/g' in.txt > out.txt"
explain = "g replaces all matches on a line, not just the first"
tags = ["replace"]

[[tips]]
title = "Edit files in place (macOS)"
snippet = "sed -i '' 's/http:/https:/g' links.txt"
explain = "BSD sed needs an argument after -i; '' means no backup. GNU sed takes plain -i"
tags = ["replace", "files"]

[[tips]]
title = "In place with a backup, any sed"
snippet = "sed -i.bak 's/DEBUG = True/DEBUG = False/' settings.py"
explain = "-i.bak works on both BSD and GNU sed and keeps settings.py.bak"
tags = ["replace", "files"]

[[tips]]
title = "Rename a word across a project"
snippet = "grep -rl 'oldName' src | xargs sed -i '' 's/oldName/newName/g'"
explain = "grep -l finds the files, sed rewrites only those"
tags = ["replace", "files", "pipes"]

[[tips]]
title = "Slashes in the pattern"
snippet = "sed 's|/usr/local|/opt/homebrew|g' paths.txt"
explain = "Any character can be the delimiter; | avoids escaping every /"
tags = ["replace"]

[[tips]]
title = "Reorder with capture groups"
snippet = "sed -E 's/([0-9]{4})-([0-9]{2})-([0-9]{2})/\\3.\\2.\\1/' dates.txt"
explain = "-E for extended regex; \\1 \\2 \\3 refer to the groups"
tags = ["replace", "regex"]

[[tips]]
title = "Print a range of lines"
snippet = "sed -n '10,20p' big.log"
explain = "-n prints nothing unless told; p prints the range"
tags = ["lines"]

[[tips]]
title = "Print between markers"
snippet = "sed -n '/BEGIN/,/END/p' file.txt"
explain = "Regex ranges work like line ranges"
tags = ["lines"]

[[tips]]
title = "Delete comment and blank lines"
snippet = "sed -e '/^#/d' -e '/^$/d' app.conf"
explain = "d drops matching lines; several -e run in order"
tags = ["lines", "filter"]

[[tips]]
title = "Drop the header, or the last line"
snippet = "sed '1d' data.csv; sed '$d' data.csv"
explain = "1 is the first line, $ the last"
tags = ["lines", "csv"]

[[tips]]
title = "Strip trailing whitespace"
snippet = "sed 's/[[:space:]]*$//' file.txt"
explain = "POSIX classes like [[:space:]] work in every sed"
tags = ["replace", "cleanup"]

[[tips]]
title = "Change only matching lines"
snippet = "sed '/^server/s/8080/9090/' app.conf"
explain = "An address before s limits the replacement to those lines"
tags = ["replace"]

[[tips]]
title = "Extract a value"
snippet = "sed -n 's/.*version=\"\\([^\"]*\\)\".*/\\1/p' build.xml"
explain = "Replace the line with the group and print only lines that matched"
tags = ["extract", "regex"]

[[tips]]
title = "Count lines"
snippet = "sed -n '$=' file.txt"
explain = "= prints the line number; at $ that is the total"
tags = ["count"]

[[tips]]
title = "Every other line"
snippet = "sed 'n;d' file.txt"
explain = "n prints and moves on a line, d drops the next: keeps odd lines"
tags = ["lines"]
