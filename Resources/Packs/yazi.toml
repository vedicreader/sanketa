id = "yazi"
name = "yazi"
processes = ["yazi"]

# Yazi 26.9.1 defaults: yazi-config/preset/keymap-default.toml at tag v26.9.1 ([mgr] section).
# "Your keys" are the prepend_keymap entries in ~/.config/yazi/keymap.toml on this Mac.

