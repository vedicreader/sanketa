id = "leela"
name = "Leela"
# Leela.app is pywebview (WKWebView) with this bundle id. Browser-hosted Leela (Chrome tab / --app window) needs title matching; see leela-contexts-proposal.md.
apps = ["org.vedicreader.leela"]
processes = []
match = []

